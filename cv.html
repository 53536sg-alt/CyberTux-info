<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My CV - cyberTux</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Courier New", Courier, monospace, monospace;
        }
        body {
            background-color: #030712;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.25;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background-color: rgba(3, 7, 18, 0.9);
            padding: 25px 20px;
            border-radius: 20px;
            border: 1px solid rgba(16, 185, 129, 0.3);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
            z-index: 1;
        }
        .title {
            font-size: 18px;
            margin-bottom: 25px;
            color: #58a6ff;
            text-align: center;
            letter-spacing: 1px;
        }
        .cv-skills {
            display: flex;
            flex-direction: column;
            gap: 10px;
            list-style: none;
        }
        .cv-skills li {
            background-color: #0f172a;
            border: 1px solid #1e293b;
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 14px;
            color: #c9d1d9;
            letter-spacing: 1px;
        }
        .back-btn {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #8b949e;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }
        .back-btn:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <div class="container">
        <div class="title">My CV</div>
        <ul class="cv-skills">
            <li>Full-stack Developer</li>
            <li>Ex hacker</li>
            <li>Hardware programmer</li>
            <li>DHS student</li>
            <li>Marketing</li>
            <li>Businessman</li>
        </ul>
        <a href="index.html" class="back-btn">← Back to Home</a>
    </div>

    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        const letters = '01ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz#@$%&';
        const fontSize = 14;
        let columns = canvas.width / fontSize;
        let drops = [];
        for (let i = 0; i < columns; i++) { drops[i] = 1; }
        function drawMatrix() {
            ctx.fillStyle = 'rgba(3, 7, 18, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#10b981';
            ctx.font = fontSize + 'px "Courier New", monospace';
            for (let i = 0; i < drops.length; i++) {
                let text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) { drops[i] = 0; }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 40);
    </script>
</body>
</html>
