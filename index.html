<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Tux / Nashwan's Informations</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Courier New", Courier, monospace, monospace;
        }
        body {
            background-color: #030712;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.25;
        }
        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            z-index: 1;
            background-color: rgba(3, 7, 18, 0.88);
            padding: 25px 20px;
            border-radius: 20px;
            border: 1px solid rgba(16, 185, 129, 0.2);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
            animation: fadeIn 0.8s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .profile-img {
            width: 95px;
            height: 95px;
            background-color: #0f172a;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #10b981;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
            animation: pulseGlow 2s infinite alternate;
        }
        .profile-img img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px rgba(16, 185, 129, 0.3); border-color: #10b981; }
            100% { box-shadow: 0 0 22px rgba(52, 211, 153, 0.6); border-color: #34d399; }
        }
        h1 {
            font-size: 14px;
            margin-bottom: 30px;
            color: #34d399;
            letter-spacing: 1px;
            word-spacing: 2px;
            direction: ltr;
        }
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .link-btn {
            display: block;
            background-color: #0f172a;
            color: #ffffff;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            border: 1px solid #1e293b;
            transition: all 0.3s ease;
        }
        .link-btn:hover {
            background-color: #1e293b;
            border-color: #10b981;
            transform: translateY(-3px);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        .telegram { border-left: 4px solid #0088cc; }
        .instagram { border-left: 4px solid #e1306c; }
        .tiktok { border-left: 4px solid #00f2fe; }
        .cv-btn { border-left: 4px solid #10b981; }
        .lang-btn { border-left: 4px solid #f59e0b; }
        .fun-btn { border-left: 4px solid #a855f7; }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <div class="container">
        <div class="profile-img">
            <img src="https://upload.wikimedia.org/wikipedia/commons/3/35/Tux.svg" alt="Tux">
        </div>
        <h1>Cyber Tux / Nashwan's Informations :</h1>

        <div class="links-list">
            <a href="cv.html" class="link-btn cv-btn">My CV</a>
            <a href="languages.html" class="link-btn lang-btn">My languages</a>
            <a href="fun.html" class="link-btn fun-btn">Fun Facts about me</a>
            <a href="https://t.me/v_u_y" target="_blank" class="link-btn telegram">My telegram account</a>
            <a href="https://www.instagram.com/q_rq56?stkn=MTRhdTRvaTkwM2d2Zw==" target="_blank" class="link-btn instagram">My Instagram account</a>
            <a href="https://www.tiktok.com/@6wz0?_r=1&_t=ZS-99gSQO55UKS" target="_blank" class="link-btn tiktok">My TikTok account</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const letters = '01ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz#@$%&';
        const fontSize = 14;
        let columns = canvas.width / fontSize;
        let drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(3, 7, 18, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#10b981';
            ctx.font = fontSize + 'px "Courier New", monospace';

            for (let i = 0; i < drops.length; i++) {
                let text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 40);
    </script>
</body>
</html>
